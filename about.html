<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Jack Wittmayer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <h1><a href="/">Jack Wittmayer</a></h1>
            <ul>
                <li><a href="/about.html">About</a></li>
            </ul>
        </nav>

        <main id="about-content"></main>

        <footer>
            <p>&copy; 2025 Jack Wittmayer</p>
        </footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://afwlsgncrzxzskbevpso.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_uItF9k3YhRXoZBziWHqUFQ_653pM2hs';

        async function loadAbout() {
            const res = await fetch(
                `${SUPABASE_URL}/rest/v1/site_content?key=eq.about&select=content`,
                { headers: { 'apikey': SUPABASE_KEY } }
            );
            const data = await res.json();
            if (data.length > 0) {
                document.getElementById('about-content').innerHTML = marked.parse(data[0].content);
            }
        }

        loadAbout();
    </script>
</body>
</html>
