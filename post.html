<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jack Wittmayer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <h1><a href="/">Jack Wittmayer</a></h1>
            <ul>
                <li><a href="/about.html">About</a></li>
            </ul>
        </nav>

        <main>
            <article class="blog-post" id="post-content">
                <p>Loading...</p>
            </article>
        </main>

        <footer>
            <p>&copy; 2025 Jack Wittmayer</p>
        </footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://afwlsgncrzxzskbevpso.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_uItF9k3YhRXoZBziWHqUFQ_653pM2hs';

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        }

        async function loadPost() {
            const slug = new URLSearchParams(window.location.search).get('slug');
            const container = document.getElementById('post-content');

            if (!slug) {
                container.innerHTML = '<p>Post not found.</p>';
                return;
            }

            try {
                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/posts?slug=eq.${encodeURIComponent(slug)}&select=*`,
                    { headers: { 'apikey': SUPABASE_KEY } }
                );
                const posts = await res.json();

                if (posts.length === 0) {
                    container.innerHTML = '<p>Post not found.</p>';
                    return;
                }

                const post = posts[0];
                document.title = `${post.title} - Jack Wittmayer`;
                container.innerHTML = `
                    <h1>${post.title}</h1>
                    <p class="post-date">${formatDate(post.date)}</p>
                    <div>${marked.parse(post.content || '')}</div>
                `;
            } catch (e) {
                container.innerHTML = '<p>Failed to load post.</p>';
            }
        }

        loadPost();
    </script>
</body>
</html>
